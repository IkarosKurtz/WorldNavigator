[project]
name = "worldnavigator"
version = "0.2.0"
description = "A tool to help you navigate through a simulated world."
readme = "README.md"
authors = [{ name = "IkarosKurtz", email = "ikaroskurtz@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["rich>=14.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "esbonio>=0.16.5",
  "hypothesis>=6.152.1",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "python-json-logger>=3.3.0",
  "ruff>=0.15.11",
  "sentry-sdk>=2.28.0",
  "sphinx>=8.2.3",
  "sphinx-autoapi>=3.6.0",
  "sphinx-autobuild>=2024.10.3",
  "sphinx-copybutton>=0.5.2",
  "sphinx-rtd-theme>=3.0.2",
  "tox>=4.53.0",
]


[tool.ruff]
line-length = 120
indent-width = 2
exclude = ["__pycache__", ".vscode", ".env", ".venv"]

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
ignore = ["F401", "F841", "F821", "F541"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
